global:
  scrape_interval: 15s
rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
      - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: "fastapi-app"
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8000